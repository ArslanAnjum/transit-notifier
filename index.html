<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halifax Transit Smart Proximity Tracker</title>
    
    <!-- Tom Select Searchable Dropdown CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/css/tom-select.default.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/js/tom-select.complete.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 360px; text-align: center; }
        h2 { color: #1a3a5f; margin-bottom: 20px; }
        .form-group { margin: 12px 0; text-align: left; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 15px; font-size: 13px; color: #666; font-weight: 500; text-align: center; }
        /* Sync library styling slightly with card components */
        .ts-control { border-radius: 6px !important; padding: 10px !important; }
    </style>
</head>
<body>

<div class="card">
    <h2>Halifax Transit Alert</h2>
    
    <!-- Stop ID Dropdown Wrap -->
    <div class="form-group">
        <select id="stopId" placeholder="Search or select Stop ID...">
            <option value="">Search or select Stop ID...</option>
        </select>
    </div>

    <!-- Route ID Dropdown Wrap -->
    <div class="form-group">
        <select id="routeId" placeholder="Select a Route ID...">
            <option value="">Select a Route ID...</option>
        </select>
    </div>

    <button id="submitBtn">Set 5-Min Alert</button>
    <p id="status">Select your route parameters to begin tracking.</p>
</div>

<!-- Script context must remain type="module" to load transitData.js -->
<script type="module">
    import transitData from './transitData.js';

    const API_ENDPOINT = "https://wnxu2jwhfgfopotnnwrtsgjeum0pzwoi.lambda-url.ca-central-1.on.aws/";
    const PUBLIC_VAPID_KEY = "BDZEQSMZKkKmAhr1bIZUBN7TrQBQS53hyhXLCEF4Pi0LidSKeCpO2ozy8WYuG38ephBxoaVYGEsoQlpKvurGVRg";

    // References for the search controller tracking references 
    let stopSearchControl;
    let routeSearchControl;

    // Attach core module actions on initialization
    document.getElementById('submitBtn').addEventListener('click', requestAndRegisterAlert);
    
    initializeSearchDropdowns();

    function initializeSearchDropdowns() {
        // 1. Extract all keys (Stop IDs) from your object and sort them numerically
        const allStops = Object.keys(transitData).sort((a, b) => {
            return (parseInt(a) || 0) - (parseInt(b) || 0);
        });

        const stopSelectEl = document.getElementById('stopId');
        
        // 2. Insert sorted stop records as actual standard options first
        allStops.forEach(stopId => {
            const option = document.createElement('option');
            option.value = stopId;
            option.textContent = `Stop ${stopId}`;
            stopSelectEl.appendChild(option);
        });

        // 3. Initialize TomSelect on Stop Dropdown
        stopSearchControl = new TomSelect('#stopId', {
            create: false,
            sortField: { field: "text", direction: "asc" },
            onChange: function(selectedStop) {
                updateRouteDropdownOptions(selectedStop);
            }
        });

        // 4. Initialize TomSelect on Route Dropdown (Starts empty and disabled)
        routeSearchControl = new TomSelect('#routeId', {
            create: false,
            sortField: { field: "text", direction: "asc" }
        });
        routeSearchControl.disable();
    }

    // Safely mutates the data pool within TomSelect on selection changes
    function updateRouteDropdownOptions(selectedStop) {
        // Reset state
        routeSearchControl.clear();
        routeSearchControl.clearOptions();

        if (selectedStop && transitData[selectedStop]) {
            routeSearchControl.enable();
            
            // Format parameters to fit the lookup collection configuration schema
            const routeOptions = transitData[selectedStop].map(route => ({
                value: route,
                text: `Route ${route}`
            }));

            routeSearchControl.addOptions(routeOptions);
            routeSearchControl.refreshOptions(false);
        } else {
            routeSearchControl.disable();
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }

    function getOrCreateBrowserId() {
        let browserId = localStorage.getItem('transit_browser_id');
        if (!browserId) {
            browserId = `USER_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
            localStorage.setItem('transit_browser_id', browserId);
        }
        return browserId;
    }

    async function requestAndRegisterAlert() {
        // Must fetch values directly via our TomSelect controllers
        const stopId = stopSearchControl.getValue();
        const routeId = routeSearchControl.getValue();
        const statusText = document.getElementById('status');

        if (!stopId || !routeId) {
            statusText.innerText = "⚠️ Missing required Stop or Route selection.";
            return;
        }

        try {
            statusText.innerText = "Requesting browser notification permissions...";
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                statusText.innerText = "❌ System permission denied by browser settings.";
                return;
            }

            statusText.innerText = "Registering device service workers...";
            const registration = await navigator.serviceWorker.register('sw.js');
            
            statusText.innerText = "Waiting for service worker activation...";
            if (!registration.active) {
                await new Promise((resolve) => {
                    const worker = registration.installing || registration.waiting;
                    if (worker) {
                        worker.addEventListener('statechange', (e) => {
                            if (e.target.state === 'activated') resolve();
                        });
                    } else {
                        resolve();
                    }
                });
            }
            await navigator.serviceWorker.ready; 
            
            statusText.innerText = "Negotiating handshake with push server...";
            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
            });

            statusText.innerText = "Saving tracking criteria to secure server storage...";

            const browserUserId = getOrCreateBrowserId();

            const databasePayload = {
                pk: `${stopId}_${routeId}`,
                sk: browserUserId,
                endpoint_url: subscription.endpoint,
                auth_key: btoa(String.fromCharCode.apply(null, new Uint8Array(subscription.getKey('auth')))),
                p256dh_key: btoa(String.fromCharCode.apply(null, new Uint8Array(subscription.getKey('p256dh')))),
                is_active: true
            };

            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(databasePayload)
            });

            if (response.ok) {
                statusText.innerText = `✅ Tracking active! You will be alerted 5 mins before Route ${routeId} reaches Stop ${stopId}.`;
            } else {
                statusText.innerText = "❌ Registration rejected by database controller.";
            }

        } catch (error) {
            console.error(error);
            statusText.innerText = `❌ Error initializing alert infrastructure: ${error.message}`;
        }
    }
</script>
</body>
</html>
