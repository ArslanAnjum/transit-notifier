<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halifax Transit Smart Proximity Tracker</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/css/tom-select.default.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/js/tom-select.complete.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main id="app-view" class="app-container"></main>

    <div id="customConfirmModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <h3 class="modal-title" id="modalTitle">Remove Alert Tracker</h3>
            <p class="modal-message" id="modalMessage">Are you sure you want to stop tracking this transit route?</p>
            <div class="modal-buttons">
                <button id="modalCancelBtn" class="btn-modal-cancel">Cancel</button>
                <button id="modalConfirmBtn" class="btn-modal-confirm">Delete Tracker</button>
            </div>
        </div>
    </div>

    <script type="module" src="router.js"></script>
</body>
</html>
